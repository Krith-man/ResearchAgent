[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "program-committee-review"
version = "0.2.0"
description = "Multi-agent conference Program Committee review simulation on Flower Agent"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.35.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["agent/**/*.py", "LICENSE"]

[tool.flwr.app.config.agent]
input = "https://arxiv.org/abs/2307.09288"

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
